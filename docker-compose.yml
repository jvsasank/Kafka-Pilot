services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kafka
      POSTGRES_PASSWORD: kafka
      POSTGRES_DB: kafka_pilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafka -d kafka_pilot"]
      interval: 10s
      timeout: 5s
      retries: 8

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kafka:kafka@postgres:5432/kafka_pilot
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: financial-transactions
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "flask --app wsgi init-db && gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 60 wsgi:app"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  consumer:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kafka:kafka@postgres:5432/kafka_pilot
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: financial-transactions
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    command: sh -c "flask --app wsgi init-db && python -m app.services.kafka_consumer"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.3
    depends_on:
      - elasticsearch
    volumes:
      - ./infra/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5001:5001"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  postgres_data:
  elastic_data:
